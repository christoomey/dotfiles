# Ctrl-s prefix key. Default => C-b. Send C-s with repeat option via C-s C-s
unbind-key C-b
set -g prefix C-s
bind -r C-s send-prefix

set -g default-command "zsh"

set -g base-index 1
set -g renumber-windows on

set -g display-panes-time 350

# improve colors
set -g default-terminal 'xterm-256color'

# Keep plenty of history for scrollback
set -g history-limit 10000

# Use emacs / readline key-bindings at the tmux command prompt `<prefix>:`
set -g status-keys emacs

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

set -g mouse on
set -g focus-events on

# Use vim keybindings in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi Space
bind -T copy-mode-vi Space send -X jump-again
bind-key -T copy-mode-vi 0 send -X back-to-indentation
bind y run 'tmux save-buffer - | pbcopy '
bind C-y run 'tmux save-buffer - | pbcopy '

# Default to incremental search in copy-mode
bind-key  -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key  -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental "%%%""
bind-key / copy-mode\; command-prompt -i -p "search up" "send -X search-backward-incremental "%%%""

# Toggle status bar display with "s"
bind-key s set -g status

# bind-key s split-window -v "capture-pane -t 1 -p | sed '/^$/d' | tr ' ' '\n' | awk 'length>10' | sort |uniq | fzf --reverse | pbcopy"

# Simplify status bar display.
set -g status-left-length 40
set -g status-fg black
set -g status-bg green
set -g status-left '[#S] '
set -g status-right "#{?pane_synchronized,--SYNCED--,} #(is-online)  #(date '+%a, %b %d - %I:%M') "

# Dismiss current pane to background window
bind b break-pane -d
bind C-b send-keys 'tat && exit' 'C-m'
bind-key ! run-shell '(tmux switch-client -l || tmux switch-client -n) && tmux kill-session -t "#S" || tmux kill-session'
bind-key J command-prompt -p "join pane from: "  "join-pane -h -s '%%'"

bind-key C-t run-shell "tmux-popup 'tmux-open-session' 100"
bind C popup -d "~/code/things-report/" -xC -yC -w80% -h80% -E "bin/checkall"

bind c new-window -c "#{pane_current_path}"
bind C-d popup -d "~/code/dotfiles/" -xC -yC -w80% -h80% -E "vim +Files"
bind g run-shell "github ."
bind-key g run-shell "tmux-lazygit"
bind-key r run-shell "touch tmp/restart.txt"

bind f run-shell "open '#{pane_current_path}'"
bind o popup -d '#{pane_current_path}' -xC -yC -w60% -h40% -EE "tmux-feature-palette"
bind t run-shell "cd '#{pane_current_path}' && cat .env | grep ^DATABASE_URL | cut -d '=' -f 2 | xargs open -a TablePlus"

bind-key C-t run-shell "tmux-popup 'tmux-open-session' 100"
bind-key C-j run-shell "tmux-popup 'tmux-switch-session' 100"
bind-key C-w popup -d '#{pane_current_path}' -xC -yC -w30% -h50% -E "tmux-switch-window"
# bind-key C-b run-shell "tmux-popup 'tmux-git-branch' 100"

bind-key p run-shell "tmux-popup"

bind-key n run-shell "tmux-popup 'vim ~/notes.md'"

bind-key O run-shell "cd '#{pane_current_path}' && bin/preview open >/dev/null 2>&1"
bind-key G run-shell "tmux-git-pr"
bind-key F popup -d '#{pane_current_path}' -xC -yC -w90% -h90% -E "tmux-feature-status"
bind-key P popup -d '#{pane_current_path}' -xC -yC -w60% -h40% -EE "tmux-feature-palette"

# Open urls in the current pane
bind-key u capture-pane -J \; \
  save-buffer "/tmp/tmux-buffer" \; \
  delete-buffer \; \
  display-popup -E -h '80%' "extract_url -l /tmp/tmux-buffer | fzf --select-1 | xargs open"

# Quick session switching back and forth. I never use the built in layouts
# (default mapping for Space), so I reclaimed the key for this
bind-key Space switch-client -l

# more intuitive keybindings for splitting
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind-key C-k split-pane -t 1 -p 100 'overmind connect'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state=,tty=,comm= | grep -iqE '^[^TXZ ]+ +#{s|/dev/||:pane_tty}\s+(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# Secondary binding for C-l to retain redraw
is_overmind="tmux display-message -p '#{pane_current_command}' | grep overmind"
bind C-l if-shell "$is_overmind" "send-prefix \; send-keys 'C-l'" "send-keys 'C-l'"
bind C-\\ send-prefix \; send-keys d

# Reload tmux.conf with prefix-r
bind C-r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# bind resizing of panes to H,J,K,L (resizes by steps of 10 lines/columns)
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1
bind -n C-S-Left resize-pane -L 10
bind -n C-S-Right resize-pane -R 10
bind -n C-S-Down resize-pane -D 5
bind -n C-S-Up resize-pane -U 5

# Style (based on https://www.youtube.com/watch?v=6Jgl5wphD00 https://github.com/hendrikmi/dotfiles/blob/main/tmux/tmux.conf)
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

set -g status-position bottom
set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold] #S #[fg=${gray_light},nobold] | "
set -g window-status-current-format "#[fg=${cyan_soft},bold]  #[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format " #I:#W"
set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${green_soft}"

# Dim inactive panes
set -g window-style 'fg=colour245,bg=colour236'
set -g window-active-style 'fg=terminal,bg=terminal'

# Active pane border stands out, inactive blends in
set -g pane-border-style 'fg=colour238,bg=colour236'
set -g pane-active-border-style 'fg=green,bg=colour236'

set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'acostanzo/tmux-huckleberry'
set -g @huckleberry-bind 'h'

set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'
