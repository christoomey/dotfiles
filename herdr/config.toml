onboarding = false
# herdr configuration
# Place this file at ~/.config/herdr/config.toml

# Show first-run notification setup on startup.
# Missing also shows onboarding; set false after you've chosen.
# onboarding = true

[theme]
# Built-in themes: catppuccin, terminal, tokyo-night, dracula, nord,
#                  gruvbox, one-dark, solarized, kanagawa, rose-pine,
#                  vesper
# name = "catppuccin"

# Follow host terminal light/dark appearance and switch Herdr UI themes.
# Existing manual behavior is unchanged unless this is true.
# auto_switch = false
# dark_name = "catppuccin"
# light_name = "catppuccin-latte"

# Override individual color tokens on top of the base theme.
# Accepts: hex (#rrggbb), named colors, rgb(r,g,b), or panel_bg = "reset"
# [theme.custom]
# panel_bg = "reset"
# accent = "#f5c2e7"
# red = "#ff6188"
# green = "#a6e3a1"

[terminal]
# Executable used for new interactive panes.
# Empty means $SHELL, then /bin/sh.
# default_shell = ""

# Startup mode for new interactive pane shells: "auto", "login", or "non_login".
# "auto" uses login shells on macOS and keeps the current behavior elsewhere.
# shell_mode = "auto"

# CWD policy for new panes, tabs, and workspaces when no explicit --cwd is provided.
# Use "follow" to inherit the source pane/workspace, "home" for $HOME,
# "current" for Herdr's process directory, or a fixed path such as "~/Projects".
# new_cwd = "follow"

[update]
# Update channel used by background version checks and `herdr update`.
# Use "stable" for normal releases or "preview" for opt-in preview builds.
# channel = "stable"

# Check herdr.dev for new Herdr versions in the background.
# version_check = true

# Check herdr.dev for remote agent-detection manifest updates in the background.
# manifest_check = true

[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
# Examples: "ctrl+b", "f12", "esc", "-"
# Action bindings use explicit syntax: "prefix+n" requires the prefix;
# "ctrl+alt+n" is a direct terminal-mode shortcut.
# Accepted key syntax: plain keys, ctrl/shift/alt/cmd/super modifiers, and special keys like enter/tab/esc/left/right/up/down.
# Named punctuation such as minus, comma, ampersand, plus, and backtick is also accepted.
# Most reliable direct bindings are ctrl+letter, function keys, and explicit modified chords.
# alt+..., cmd/super, and punctuation-with-modifiers may depend on your terminal/tmux setup.
prefix = "ctrl+s"

# ============================================================================
# tmux-parity keybindings (added from tmux.conf audit — 2026-07-17)
# Each maps a herdr action to your existing tmux muscle memory.
# ============================================================================

# Pane focus with bare ctrl+hjkl (mirrors your vim-tmux-navigator no-prefix
# binds; note: no vim passthrough — herdr eats the key, so ctrl+l won't clear
# the screen and vim splits won't be crossed). prefix+hjkl kept as a fallback.
focus_pane_left  = ["ctrl+h", "prefix+h"]
focus_pane_down  = ["ctrl+j", "prefix+j"]
focus_pane_up    = "ctrl+k"  # prefix+k is the agent finder (see [[keys.command]])
focus_pane_right = ["ctrl+l", "prefix+l"]

# Splits match tmux: "\" side-by-side (vertical divider), "-" stacked.
split_vertical   = ["prefix+backslash", "prefix+v"]
split_horizontal = "prefix+minus"

# Detach on prefix+d (tmux muscle memory); herdr's native prefix+q still works.
detach = ["prefix+q", "prefix+d"]

# herdr's native workspace picker stays on prefix+w. prefix+ctrl+j is now a
# custom fzf workspace switcher (see [[keys.command]] below).
workspace_picker = "prefix+w"

# herdr's native goto is unbound — prefix+ctrl+w is now a custom fzf tab
# switcher (see [[keys.command]] below). prefix+g remains lazygit.
goto = ""

# Free prefix+o from herdr's native open_notification_target so it can drive the
# augie feature palette (see [[keys.command]] below), mirroring tmux `prefix o`.
open_notification_target = ""

# Free prefix+shift+g from herdr's native new_worktree so it can open the PR on
# GitHub (see herdr-git-pr [[keys.command]] below), mirroring tmux `prefix G`.
new_worktree = ""

# Prefix-mode actions
# help = "prefix+?"
# settings = "prefix+s"
# detach = "prefix+q"
# reload_config = "prefix+shift+r"
# open_notification_target = "prefix+o"
# workspace_picker = "prefix+w"
# goto = "prefix+g"
# new_workspace = "prefix+shift+n"
# new_worktree = "prefix+shift+g"
# open_worktree = ""    # optional, unset by default
# remove_worktree = ""  # optional, unset by default; opens confirmation
# rename_workspace = "prefix+shift+w"
# close_workspace = "prefix+shift+d"
# previous_workspace = "" # optional, unset by default
# next_workspace = ""     # optional, unset by default
# previous_agent = ""     # optional, unset by default
# next_agent = ""         # optional, unset by default
# focus_agent = ""        # optional indexed binding, e.g. "prefix+alt+1..9"
# remote_image_paste = "ctrl+v" # only active in herdr --remote; empty disables raw-key image paste
# new_tab = "prefix+c"
# rename_tab = "prefix+shift+t"
# previous_tab = "prefix+p"
# next_tab = "prefix+n"
# switch_tab = "prefix+1..9"
# switch_workspace = ""   # optional indexed binding, e.g. "prefix+shift+1..9"
# close_tab = "prefix+shift+x"
# rename_pane = "prefix+shift+p"
# edit_scrollback = "prefix+e"
# focus_pane_left = "prefix+h"
# focus_pane_down = "prefix+j"
# focus_pane_up = "prefix+k"
# focus_pane_right = "prefix+l"
# cycle_pane_next = "prefix+tab"
# cycle_pane_previous = "prefix+shift+tab"
# last_pane = ""          # optional, unset by default; bind e.g. "prefix+tab" for global back-and-forth
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"
# close_pane = "prefix+x"
# zoom = "prefix+z"       # legacy alias: fullscreen
# resize_mode = "prefix+r"
# toggle_sidebar = "prefix+b"

# Navigate-mode movement. These local shortcuts win while navigate mode is open.
# They are independent from focus_pane_*. Do not include prefix+, esc, enter, tab, or 1..9 here.
# navigate_workspace_up = "up"
# navigate_workspace_down = "down"
# navigate_pane_left = "h"      # left arrow always focuses the pane to the left
# navigate_pane_down = "j"
# navigate_pane_up = "k"
# navigate_pane_right = "l"     # right arrow always focuses the pane to the right

# Custom commands use the same binding syntax.
# type = "shell" runs detached in the background.
# type = "pane" opens a temporary pane and closes it when the command exits.
# On Windows, command strings run through cmd.exe /d /c.
# lazygit on prefix+g (mirrors your tmux `prefix g`). Feature-dir aware: in an
# augie feature dir it auto-picks the dirty backend/frontend side, or shows a
# single-key b/f chooser with dirty flags when both/neither are dirty (see
# herdr-lazygit). This popup only ever hosts the chooser — sized in cells to
# fit the menu — and lazygit opens in its own 95% popup right after, via the
# augie-git plugin pane (herdr/plugins/augie-git, `herdr plugin link`ed).
# (needs herdr >= 0.7.4 for type="popup")
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "herdr-lazygit"
width = 46
height = 9

# Reclaim clear-screen: bare ctrl+l now focuses the pane to the right, so
# prefix+ctrl+l sends a literal ctrl+l into the focused pane (readline clear),
# mirroring vim-tmux-navigator's `bind C-l send-keys 'C-l'`.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "herdr pane send-keys $HERDR_ACTIVE_PANE_ID ctrl+l"

# fzf fuzzy workspace (session) switcher on prefix+ctrl+j — mirrors your tmux
# switch-session popup. type="popup" floats it centered (needs herdr >= 0.7.4).
[[keys.command]]
key = "prefix+ctrl+j"
type = "popup"
command = "herdr-switch-workspace"
width = "50%"
height = "50%"

# fzf fuzzy tab (window) switcher on prefix+ctrl+w — mirrors your tmux
# switch-window popup.
[[keys.command]]
key = "prefix+ctrl+w"
type = "popup"
command = "herdr-switch-tab"
width = "50%"
height = "50%"

# Bounce to the last-used workspace on prefix+space — mirrors tmux-conf's
# `bind-key Space switch-client -l`. herdr has no native last-used action, so
# herdr-last-workspace tracks it in a state file for a true A<->B toggle.
[[keys.command]]
key = "prefix+space"
type = "shell"
command = "herdr-last-workspace"

# Copy a moimenubar:// deep link to the session you are sitting in, on
# prefix+y (tmux muscle memory: y = yank). herdr passes the pane the key was
# pressed from as HERDR_ACTIVE_PANE_ID, so herdr-link-popup can ask
# `herdr pane get` for that pane's Claude session id, cwd, tab and workspace
# and offer both the chat link and its feature-worktree link. enter copies
# markdown, ctrl-r copies rich text (ctrl-m *is* enter outside the kitty
# protocol, so markdown is the enter/default rather than a mode to toggle);
# tab switches chat/feature, x also closes the source tab (workspace, for a
# feature) after copying. The links themselves come from claude-session-link.
[[keys.command]]
key = "prefix+y"
type = "popup"
command = "herdr-link-popup"
description = "Copy session link"
width = 96
height = 14

# Agent fuzzy finder on prefix+k: the New Session popup (herdr-new-thread)
# opened straight into its agents view. Blocked/done agents are the list
# (blocked first, then most recently finished), everything else dimmed below;
# ctrl+a widens to all agents (most recently visited first), ctrl+j/k move,
# enter focuses the pane. Replaced herdr-bar on prefix+a (plugin still
# installed, now unbound).
[[keys.command]]
key = "prefix+k"
type = "popup"
command = "herdr-new-thread --agents"
description = "Agents"
width = 99
height = 33

# prefix+o routes through herdr-open-palette (~/bin): in moi checkouts and
# moi__worktrees/* it shows a small moi palette (open in browser / open notes);
# everywhere else it execs the augie panel, unchanged.
# augie panel (mirrors tmux `prefix o`, which routes to the same binary via
# tmux-feature-palette). Go/Bubble Tea TUI (fullstack/panel/ via `af ui`):
# Local tab with per-feature quick actions (f/s/t/i/n) when invoked from a
# feature dir (via HERDR_ACTIVE_PANE_CWD), plus a global Sessions tab —
# open/closed features, mprocs status, x stop-mprocs, n/d/o/c for
# new/down/open/close, D for global down. The older OpenTUI picker (herdr-feature-palette-tui) and
# fzf palette (herdr-feature-palette) are kept as fallbacks.
[[keys.command]]
key = "prefix+o"
type = "popup"
command = "herdr-open-palette"
width = "70%"
height = "55%"

# Supervisor HUD on prefix+O: the same panel, but jump straight to the global
# Sessions tab even when the active pane is inside a feature dir.
[[keys.command]]
key = "prefix+shift+o"
type = "popup"
command = "af ui --sessions"
width = "70%"
height = "55%"

# Open the PR on GitHub on prefix+G (mirrors your tmux `prefix G`). Same
# feature-dir detection as prefix+g, but runs git-opr instead of lazygit.
# type="popup" so the single-key backend/frontend chooser has a tty when
# both/neither side is dirty; auto-picks (brief popup) when exactly one is.
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "herdr-git-pr"
width = 46
height = 9

# Open the active pane's directory in Finder on prefix+f (mirrors tmux
# `bind f run-shell "open '#{pane_current_path}'"`). type="shell" — no popup.
[[keys.command]]
key = "prefix+f"
type = "shell"
command = 'open "$HERDR_ACTIVE_PANE_CWD"'

# Split + start a Claude session:
#   prefix+ctrl+p  → new pane to the RIGHT running claude
#   prefix+ctrl+n  → new pane BELOW running claude
# ctrl+letter chords because the host terminal drops ctrl+punctuation in legacy
# keyboard mode (only ctrl+[ \ ] ^ _ carry a control byte; ctrl+- has none).
# Inherits the active pane's cwd so the session lands in the workspace's repo.
# Agent names must be unique per session, so suffix with a timestamp — a bare
# `claude` fails with agent_name_taken once one Claude session already exists.
[[keys.command]]
key = "prefix+ctrl+p"
type = "shell"
command = 'herdr agent start "claude-$(date +%H%M%S)" --split right --focus --cwd "$HERDR_ACTIVE_PANE_CWD" -- claude'

[[keys.command]]
key = "prefix+ctrl+n"
type = "shell"
command = 'herdr agent start "claude-$(date +%H%M%S)" --split down --focus --cwd "$HERDR_ACTIVE_PANE_CWD" -- claude'

# Promote the active pane into its own tab on prefix+M — the middle rung of the
# continuum (quick chat -> own tab -> full worktree). Moves the live pane (Claude
# session + scrollback intact), no restart. Follows split_* + agent-start above.
[[keys.command]]
key = "prefix+shift+m"
type = "shell"
command = 'herdr pane move "$HERDR_ACTIVE_PANE_ID" --new-tab --focus'

# One-off Claude session in the august workspace from anywhere on prefix+ctrl+t.
# Popup asks for a name, an optional first prompt, and open-vs-background;
# herdr-new-thread then (detached, so the popup closes on submit) focuses or
# opens the augie-features root workspace, adds a tab with that label, starts
# claude in it as a same-named agent, and sends the prompt. The tab closes
# itself when claude exits (HERDR_THREAD hook in zsh/configs/herdr.zsh).
# ctrl+1..3 switch the popup's sections (agents / chats / features), ctrl+t
# its subtabs: chats › resume is a fuzzy list of past sessions in that root
# (enter resumes one in a new tab, or focuses it if it is still running);
# features › sidebar mirrors the sidebar's spaces; J/K or a mouse drag
# reorders them live.
[[keys.command]]
key = "prefix+ctrl+t"
type = "popup"
command = "herdr-new-thread"
description = "New Session"
width = 86
height = 33

# [[keys.command]]
# key = "prefix+alt+g"
# type = "pane"
# command = "lazygit"

# Legacy indexed shortcut config is still parsed for compatibility.
# Prefer switch_tab, switch_workspace, and focus_agent for new configs.
# [keys.indexed]
# tabs = ""       # e.g. "ctrl" makes ctrl+1..9 switch tabs directly
# workspaces = "" # e.g. "ctrl+shift" makes ctrl+shift+1..9 switch workspaces directly
# agents = ""     # e.g. "alt" makes alt+1..9 focus agent rows directly

# [worktrees]
# directory = "~/.herdr/worktrees"

[ui]
# Sidebar width (auto-scaled based on workspace names, this sets the default)
# sidebar_width = 26

# Minimum sidebar width when expanded (columns)
# sidebar_min_width = 18

# Maximum sidebar width when expanded (columns)
# sidebar_max_width = 36

# Collapsed sidebar presentation: "compact" keeps the narrow status rail, "hidden" uses zero width.
sidebar_collapsed_mode = "hidden"

# Terminal width at or below which Herdr uses the mobile single-column layout.
# Increase this for foldables, tablets, or wide phone terminals.
# mobile_width_threshold = 64

# Capture mouse input for Herdr's mouse UI.
# Set false to let the terminal handle normal clicks, such as Cmd-clicking URLs.
# Pane apps like lazygit and btop can still receive mouse when they request it.
# mouse_capture = true

# Host cursor policy: "auto", "native", or "drawn".
# "auto" draws Herdr's own cursor on Windows to avoid ConPTY cursor flicker, and uses the native terminal cursor elsewhere.
# "native" always uses the outer terminal cursor. "drawn" always draws Herdr's cursor as terminal cell content.
# host_cursor = "auto"

# Optional modifier that forwards right-click hold/drag gestures to pane apps instead of opening Herdr's pane menu.
# Empty/off disables this. Shift is intentionally unsupported because terminals commonly reserve Shift+mouse.
# right_click_passthrough_modifier = ""

# Force a full redraw when the outer terminal regains focus.
# Set false to reduce visible flashing when switching back to Herdr.
# Trade-off: rare host terminal surface corruption may persist until the next full redraw.
# redraw_on_focus_gained = true

# Pane scrollback lines to scroll per mouse wheel notch.
# mouse_scroll_lines = 3

# Ask for confirmation before closing a workspace
# confirm_close = true

# Ask for a tab name before creating a new tab.
# Set false to create tabs immediately with generated names.
# prompt_new_tab_name = true

# Draw borders around split panes.
# pane_borders = true

# Keep split panes visually separated instead of sharing divider borders.
# pane_gaps = true

# Show detected/reported agent labels in split pane borders when no manual pane name is set.
# show_agent_labels_on_pane_borders = false

# Hide the tab row when a workspace has exactly one tab.
# New tabs can still be created with the configured keybinding.
# hide_tab_bar_when_single_tab = false

# Agent panel ordering: "spaces" (grouped by space) or "priority" (attention queue).
# "workspaces" is accepted as an alias for "spaces".
# agent_panel_sort = "spaces"

# Accent color for highlights, borders, and navigation UI.
# Accepts: hex (#89b4fa), named colors (cyan, blue, magenta), or rgb(r,g,b)
# accent = "cyan"

# Background notification popup delivery
agent_panel_sort = "priority"

# Shape + color per agent state (○ idle · ◐ working · × blocked · ✓ done)
# instead of plain dots — the same glyphs the prefix+k agent finder
# uses, so the sidebar and the popup read alike.
status_indicators = "symbols"
[ui.toast]
# off = disable pop-up notifications
# herdr = show in-app toasts
# terminal = ask the outer terminal to show a desktop notification
# system = ask the OS notification service directly
# delivery = "off"
# delay_seconds = 1

# Off: herdr-focus-notify (plugin) now owns done/blocked desktop alerts, with a
# clickable Focus button that jumps to the pane. "system" here would duplicate.
delivery = "off"
[ui.toast.herdr]
# position = "bottom-right"

[ui.toast.clipboard]
# enabled = true
# position = "bottom-center"

# Play sounds when agents change state in background workspaces
[ui.sound]
# enabled = true
# Optional custom mp3 sound files. Relative paths are resolved from this config file's directory.
# path = "sounds/notification.mp3"   # one mp3 file for all sound notifications
# done_path = "sounds/done.mp3"      # overrides only finished notifications
# request_path = "sounds/request.mp3" # overrides only needs-attention notifications

# Per-agent overrides: default | on | off
# By default, droid is muted.
# [ui.sound.agents]
# droid = "off"

[session]
# Resume supported AI-agent panes into their native conversation sessions after
# a Herdr server restart. Requires official integrations that report session refs.
# resume_agents_on_restore = true

[remote]
# Whether herdr manages the ssh config used for `herdr --remote`.
# When true (default), herdr runs remote ssh through a generated config that
# includes your ~/.ssh/config first and adds ServerAliveInterval/
# ServerAliveCountMax as fallbacks (so any keepalive values you set yourself
# still win) to survive idle network/NAT timeouts. Herdr also uses a private
# per-attach OpenSSH control socket to reuse the first authenticated connection.
# Set false to run plain ssh against your ssh config unchanged — this does not
# force keepalive or multiplexing off, it only stops herdr from adding its own.
# manage_ssh_config = true

[experimental]
# Allow launching herdr from inside a herdr-managed pane.
# allow_nested = false
# Experimental local Kitty graphics rendering for attached clients.
# Requires a Kitty graphics-compatible outer terminal.
# kitty_graphics = false
# Save recent pane screen history across full server restarts.
pane_history = false
# While prefix mode is active, temporarily switch the macOS host input
# source to an ASCII-capable keyboard layout so prefix commands register
# even when a CJK IME is active, then restore the previous input source
# when prefix mode exits. macOS only; best-effort. Default: false.
# switch_ascii_input_source_in_prefix = false
# Expose the focused pane's cursor to the outer terminal so macOS input
# methods keep tracking the candidate window when TUIs paint their own
# cursor (Claude Code, pi, codex). Trade-off: extra cursor visible for
# apps that hide it without painting a replacement (vim normal mode, etc.).
# reveal_hidden_cursor_for_cjk_ime = false
# Optional allow-list: only reveal for focused panes whose detected agent
# matches one of these names. Empty means apply to any focused pane.
# If the list contains no valid names, the reveal does not apply.
# Accepted: pi, claude, codex, gemini, cursor, devin, cline, opencode,
# copilot, kimi, kiro, droid, amp, grok, hermes, kilo, qodercli, qoder.
# cjk_ime_agents = []
# Cursor shape rendered when reveal_hidden_cursor_for_cjk_ime is true.
# Values: block, steady_block (default), underline, steady_underline, bar, steady_bar.
# cjk_ime_cursor_shape = "steady_block"

[advanced]
# Maximum scrollback buffer size in bytes retained per pane terminal.
# Matches Ghostty's default scrollback-limit behavior.
# scrollback_limit_bytes = 10000000
